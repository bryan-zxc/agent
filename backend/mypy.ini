# MyPy configuration for async/await correctness
[mypy]
python_version = 3.13
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Enable coroutine checking - detects unused coroutines (missing awaits)
disable_error_code = 
enable_error_code = unused-coroutine

# Stricter checking for task modules where async issues occurred
[mypy-src.agent.tasks.*]
strict_optional = true

[mypy-src.agent.core.*]
strict_optional = true

[mypy-src.agent.models.*]
strict_optional = true