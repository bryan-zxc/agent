services:
  postgres:
    image: postgres:17-alpine
    container_name: agent_postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
      - .env.local
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agent_user}
      - POSTGRES_DB=postgres  # Admin database only, not for application use
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
      # POSTGRES_PASSWORD is loaded from env_file (.env.local)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres:/docker-entrypoint-initdb.d
    networks:
      - agent_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_user} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c jit=off

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
      - "8888:8888"
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./files:/app/files
      - ./db:/app/db
      - backend_cache:/root/.cache
      - npm_cache:/root/.npm
    environment:
      - PYTHONPATH=/app/src
      - ENVIRONMENT=development
      - PORT=${BACKEND_PORT}
    env_file:
      - .env
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: uv run python main.py
    networks:
      - agent_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent_frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - ./shared:/app/shared
      - frontend_node_modules:/app/node_modules
      - frontend_cache:/app/.next
    environment:
      - NODE_ENV=development
      - PORT=${FRONTEND_PORT}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    env_file:
      - .env
      - .env.local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: npm run dev
    networks:
      - agent_network

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local
  backend_cache:
    driver: local
  frontend_cache:
    driver: local
  npm_cache:
    driver: local

networks:
  agent_network:
    driver: bridge
    name: agent_network